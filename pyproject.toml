[project]
name = "kds-team-processor-add-columns"
version = "0.1.0"
description = "Add columns to input tables, with static values generated by specified function"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component>=1.6.8",
    "keboola-utils>=1.1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP"]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "keboola-datadirtest>=2.3.0",
    "mock>=5.2.0",
    "pytest>=9.1.1",
    "ruff==0.9.10",
]
